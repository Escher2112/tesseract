<!doctype html>
<html><head><meta charset="utf-8"><title>Session Cube</title>
<!-- Session Cube (Lyra 2026-10-27): six live terminals on a cube, served by server.py.
     Spaceball: spin it = turn one face left/right · tilt it = top/bottom face · button 1 = select (typing goes there) · button 2 = full screen
     on/off · button 3 = back to face 1. PowerMate: turn = step faces · tap = full screen on/off.
     Keys (Ctrl+Option): arrows = turn · Return = full screen · 1-6 = jump to a face. Clicking a face selects it. -->
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  :root { --glow: 1; --S: 560px; --bg: #07060d; --face: #000000; --edge: #4a3c8f; --sel: #c9b8ff; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at center, #15112a 0%, var(--bg) 70%); overflow: hidden;
               font: 12px Menlo, Monaco, monospace; color: #b9adf0; }
  #scene { position: fixed; inset: 0; perspective: 2200px; display: flex; align-items: center; justify-content: center; }
  #cube { width: var(--S); height: var(--S); position: relative; transform-style: preserve-3d; }
  .face { position: absolute; inset: 0; background: var(--face); border: 2px solid var(--edge); border-radius: 6px; box-sizing: border-box;
          backface-visibility: hidden; display: flex; flex-direction: column; overflow: hidden; }
  .face.front { box-shadow: 0 0 24px rgba(140, 110, 255, .35); }
  .face.sel { border-color: var(--sel); box-shadow: 0 0 34px rgba(201, 184, 255, .75); }
  .hdr { font-size: 15px; font-weight: 700; letter-spacing: .02em; padding: 6px 10px; background: #17132b; color: #cfc4ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
  .host { flex: 1; padding: 4px; min-height: 0; }
  .host .xterm { height: 100%; }
  #full { position: fixed; inset: 0; background: var(--face); display: none; flex-direction: column; z-index: 5; }
  #full.on { display: flex; }
  /* 23:03 Chris: the help line overlapped Claude Code's bottom bar in full screen. Now it's a ⚙ in the top-right corner that opens a panel. */
  #gear { position: fixed; top: 4px; right: 10px; z-index: 7; font-size: 18px; color: #8f86d9; cursor: pointer; opacity: .7; user-select: none; }
  #gear:hover { opacity: 1; }
  #help { position: fixed; top: 32px; right: 10px; z-index: 7; display: none; max-width: 420px; max-height: calc(100vh - 44px); overflow-y: auto; padding: 12px 14px; line-height: 1.6;
          background: rgba(20, 16, 40, .96); border: 1px solid var(--edge); border-radius: 8px; color: #d8d0ff; }
  #help.on { display: block; }
  #helptext { white-space: pre-line; }  #setting { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--edge); }
  /* 2026-10-28 Priority 1 (colors) + 2 (attention), Chris + Riven's spec. A face's group colour is an etched, glowing double line
     around its edge (never a fill: the terminal stays black and readable). A face waiting on a person pulses in ITS OWN colour
     (--pc, which can fade toward white the longer it waits); uncoloured faces pulse lavender. */
  .face { --gc: var(--edge); --pc: #c9b8ff; }
  .face.colored { border: 3px double var(--gc); box-shadow: 0 0 calc(16px * var(--glow)) var(--gc), inset 0 0 calc(6px * var(--glow)) var(--gc); }
  .face.colored.sel { box-shadow: 0 0 calc(34px * var(--glow)) var(--gc), inset 0 0 calc(10px * var(--glow)) var(--gc); }
  .face.attn { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { border-color: var(--pc); box-shadow: 0 0 6px var(--pc); }
                     50% { border-color: var(--pc); box-shadow: 0 0 calc(40px * var(--glow) + 10px) var(--pc), inset 0 0 14px var(--pc); } }
  .face.dim { opacity: .15; }
  body.lowfx .face.colored, body.lowfx .face.colored.sel { box-shadow: none; }
  body.lowfx .face.attn { animation: none; border: 4px solid var(--pc); }
  #full.colored { border: 3px double var(--gc); box-sizing: border-box; }
  #attnq { position: fixed; top: 6px; right: 40px; z-index: 8; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .aq { padding: 4px 10px; border-radius: 6px; background: rgba(20, 16, 40, .94); color: #e8e2ff; border: 2px solid var(--pc); cursor: pointer; }
  .aq .x { margin-left: 10px; opacity: .55; }  .aq .x:hover { opacity: 1; }
  #prefs { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--edge); line-height: 2; }
  #prefs input[type=color] { width: 26px; height: 18px; padding: 0; border: 0; background: none; vertical-align: middle; }
  #prefs input[type=number] { width: 42px; } #prefs a { color: #c9b8ff; } #prefs button { font: inherit; margin-right: 4px; }
  #toast { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 7; padding: 4px 12px; border-radius: 6px;
           background: rgba(20, 16, 40, .9); color: #d8d0ff; display: none; }
</style></head>
<body>
<div id="scene"><div id="cube"></div></div>
<div id="full"><div class="hdr" id="fullhdr"></div></div>
<div id="gear" title="How to drive it">⚙</div><div id="help"><div id="helptext"></div><div id="setting">hand-back button: <b id="tog">6</b> &nbsp;<a href="#" id="learn" style="color:#c9b8ff">change</a></div><div id="prefs"></div></div><div id="toast"></div><div id="attnq"></div>
<script src="/vendor/xterm.js"></script><script src="/vendor/addon-fit.js"></script>
<script>
'use strict';
const KEY = new URLSearchParams(location.search).get('k') || '';
const TerminalCls = window.Terminal || (window.xterm && window.xterm.Terminal);
const FitCls = (window.FitAddon && (window.FitAddon.FitAddon || window.FitAddon));
const cube = document.getElementById('cube'), full = document.getElementById('full'), fullhdr = document.getElementById('fullhdr'), help = document.getElementById('help');
const S = Math.round(Math.min(innerWidth, innerHeight) * 0.66); document.documentElement.style.setProperty('--S', S + 'px');
// face places: 0-3 around the sides, 4 top, 5 bottom
const PLACE = [`rotateY(0deg)`, `rotateY(90deg)`, `rotateY(180deg)`, `rotateY(-90deg)`, `rotateX(90deg)`, `rotateX(-90deg)`].map(r => `${r} translateZ(${S / 2}px)`);
// 2026-10-28 "group faces by colour": face i (= shell i, its session) sits in place slot[i]. Regrouping changes only where a face SITS;
// the shell, its session, title and colour all stay with the face. Off = every face in its own place.
let slot = [0, 1, 2, 3, 4, 5]; const P = i => PLACE[slot[i]];
// 22:56 Chris: after rolling, "top" isn't top any more, so faces are just numbered and NAMED BY THEIR SESSION: the title the program
// in the terminal sets (Claude Code sets one per session, the same name his terminal tabs show).
const NAMES = ['1', '2', '3', '4', '5', '6'];
// 23:36 Chris: "the colors are wrong… do the same terminal colors in the app that we're using here." His Terminal.app profile is "Basic"
// (read from com.apple.Terminal at 23:38): background #000000, text #009eff, cursor #0054a2, selection #4a598b; the 16 ANSI colours are
// Terminal's standard Basic set (not overridden in his profile; values from Terminal's defaults, from memory).
const THEME = { background: '#000000', foreground: '#009eff', cursor: '#0054a2', cursorAccent: '#000000', selectionBackground: '#4a598b',
  black: '#000000', red: '#990000', green: '#00a600', yellow: '#999900', blue: '#0000b2', magenta: '#b200b2', cyan: '#00a6b2', white: '#bfbfbf',
  brightBlack: '#666666', brightRed: '#e50000', brightGreen: '#00d900', brightYellow: '#e5e500', brightBlue: '#0000ff',
  brightMagenta: '#e500e5', brightCyan: '#00e5e5', brightWhite: '#e5e5e5' };
const faces = NAMES.map((name, i) => {
  const el = document.createElement('div'); el.className = 'face'; el.style.transform = P(i);
  const hdr = document.createElement('div'); hdr.className = 'hdr'; hdr.textContent = name;
  const host = document.createElement('div'); host.className = 'host'; el.append(hdr, host); cube.appendChild(el);
  const term = new TerminalCls({ fontFamily: 'Menlo, Monaco, monospace', fontSize: 10, cursorBlink: true, scrollback: 5000,
    theme: THEME });
  const fit = new FitCls(); term.loadAddon(fit); term.open(host);
  const f = { i, name, el, hdr, host, term, fit, title: '', out: '', busy: false };
  term.onData(d => input(f, d));
  term.onTitleChange(t => { f.title = t; label(f); });
  el.addEventListener('mousedown', () => { select(i); goTo(i); });
  return f;
});
function label(f) { const t = f.name + '  ·  ' + (f.title || 'no session yet: type claude'); f.hdr.textContent = t; if (fullFace === f.i) fullhdr.textContent = t + '   (button 2 / Ctrl+Option+Return = back to the cube)'; if (typeof renderAttn === 'function') renderAttn(); }

// ---------- talking to server.py: one stream in; keystrokes out in order, one request at a time per face
const post = (path, body) => fetch(`${path}${path.includes('?') ? '&' : '?'}k=${encodeURIComponent(KEY)}`, { method: 'POST', body });
function input(f, d) { f.out += d; pump(f); }
function pump(f) {
  if (f.busy || !f.out) return; const d = f.out; f.out = ''; f.busy = true;
  post(`/in?f=${f.i}`, d).catch(() => {}).finally(() => { f.busy = false; pump(f); });
}
function refit(f) { try { f.fit.fit(); } catch (e) {} post(`/resize?f=${f.i}&c=${f.term.cols}&r=${f.term.rows}`); }
const es = new EventSource(`/stream?k=${encodeURIComponent(KEY)}`);
es.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.f !== undefined && !m.k) { const f = faces[m.f]; if (m.replay) f.term.reset(); if (m.o) f.term.write(m.o); if (m.exit) f.term.write('\r\n\x1b[2m[shell ended: type anything to start a new one]\x1b[0m\r\n'); }
  else if (m.k === 'sb') { (m.a === 't' ? sbT : sbR).splice(0, 3, ...m.v); sbAt = performance.now(); }
  else if (m.k === 'sbb') sbButtons(m.m);
  else if (m.k === 'config') { document.getElementById('tog').textContent = m.toggle; if (m.learned) toast(`hand-back button is now ${m.toggle}`); if (m.prefs) loadPrefs(m.prefs); }
  else if (m.k === 'learned') { prefs.buttons[m.target] = m.b; savePrefs(); renderPrefs(); toast(`${m.target} is now button ${m.b}`); }
  else if (m.k === 'attn') { const a = att[m.f]; if (m.since !== a.since) a.dismissed = false; Object.assign(a, { s: m.s, r: m.r, since: m.since }); renderAttn(); }
  else if (m.k === 'sbfree') { sbT = [0, 0, 0]; sbR = [0, 0, 0]; toast(m.free ? `Spaceball → your Mac (press ${document.getElementById('tog').textContent} to take it back)` : 'Spaceball → the cube'); }
  else if (m.k === 'knob') knob(m.t, m.b);
};
es.onopen = () => faces.forEach(refit);

// ---------- turning (rewritten 22:40 after Chris saw faces spin in place): the cube's orientation is ONE rotation (a quaternion), and
// every step turns it about the SCREEN's axes (side = screen vertical, over-the-top = screen horizontal), so a side twist means side no
// matter where the cube has been. After each step, whatever face is in front is turned upright, folded into the SAME target rotation,
// so it arrives in one smooth move instead of a second spin. (The old version kept three separate angles; after rolling over the top,
// its "side" axis pointed at the viewer and a side step spun the face in place, then the straightening flipped 180° — reproduced 22:38.)
let Q = [1, 0, 0, 0], Qt = [1, 0, 0, 0], selFace = -1, fullFace = -1;
let sbT = [0, 0, 0], sbR = [0, 0, 0], sbAt = 0, sbMask = 0, armed = { y: true, p: true }, heldSince = { y: 0, p: 0 };
let zArmed = true; const PRESS = 200;
const PUSH = 130, RELEASE = 50, REPEAT_MS = 1400;                   // 22:50 "too sensitive": firmer twist, slower repeat while held                     // spaceball readings run about -350..+350
const qMul = (a, b) => [a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3], a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
                        a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1], a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
const qAxis = (x, y, z, deg) => { const h = deg * Math.PI / 360, s = Math.sin(h); return [Math.cos(h), x * s, y * s, z * s]; };
const qNorm = q => { const n = Math.hypot(...q); return q.map(v => v / n); };
function qSlerp(a, b, t) {
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3]; if (d < 0) { b = b.map(v => -v); d = -d; }
  if (d > 0.9995) return qNorm(a.map((v, i) => v + (b[i] - v) * t));
  const th = Math.acos(d), s = Math.sin(th); return a.map((v, i) => (v * Math.sin((1 - t) * th) + b[i] * Math.sin(t * th)) / s);
}
function qMatrix(q) {                                                  // p' = R p, written into DOMMatrix's column-major order
  const [w, x, y, z] = q;
  const R = [1-2*(y*y+z*z), 2*(x*y-w*z), 2*(x*z+w*y), 2*(x*y+w*z), 1-2*(x*x+z*z), 2*(y*z-w*x), 2*(x*z-w*y), 2*(y*z+w*x), 1-2*(x*x+y*y)];
  return new DOMMatrix([R[0], R[3], R[6], 0, R[1], R[4], R[7], 0, R[2], R[5], R[8], 0, 0, 0, 0, 1]);
}
function faceAt(q, i) { return qMatrix(q).multiply(new DOMMatrix(P(i))); }   // bare face, ignoring its picture turn
function frontOf(q) { let best = 0, bz = -1e9; for (let i = 0; i < 6; i++) { const z = faceAt(q, i).m43; if (z > bz) { bz = z; best = i; } } return best; }
function frontFace() { return frontOf(Qt); }
function upright(q) {                                                  // turn about the screen's depth axis until the front face reads upright
  const m = faceAt(q, frontOf(q)), o = m.transformPoint(new DOMPoint(0, 0, 0)), u = m.transformPoint(new DOMPoint(0, -1, 0));
  const ang = Math.atan2(u.x - o.x, -(u.y - o.y)) * 180 / Math.PI;      // 0 = upright, + = leaning clockwise
  return Math.abs(ang) < 1 ? q : qNorm(qMul(qAxis(0, 0, 1, -Math.round(ang / 90) * 90), q));
}
// 22:50 FOURTH design, Chris's: "do the natural motion so it goes to the right face and shows it upside down and then notices it's
// upside down and then it'll just rotate itself." So a step is ONE pure quarter-roll about the screen axis you pushed (nothing mixed in),
// and only after you've paused for SETTLE_MS does the front face get a separate flat spin upright. While you keep rolling there is no
// straightening, so up-up-up rolls front, top, back, bottom, front like a real cube.
const SETTLE_MS = 1000; let lastStepAt = 0;
function frontFace() { return frontOf(Qt); }
// dy +1 brings the face on the screen's LEFT to the front, dp +1 rolls the face at the screen's TOP down to the front
const rollQ = (q, dy, dp) => qNorm(qMul(dy ? qAxis(0, 1, 0, 90 * dy) : qAxis(1, 0, 0, -90 * dp), q));
// 22:46 Chris: "make it not correct geometry… correct for working with it… every time you turn, the face it goes to presents itself
// right side up." So the cube still rolls one clean quarter-turn the way you pushed, but the arriving face's PICTURE is turned inside
// its square (0/90/180/270°) before it rolls in, so it lands upright with no extra spin. (Frozen previous version, pause-then-straighten:
// index.html.v1-natural-roll-pause-straighten.)
function present(q) {
  const f = frontOf(q), m = faceAt(q, f), o = m.transformPoint(new DOMPoint(0, 0, 0)), u = m.transformPoint(new DOMPoint(0, -1, 0));
  const ang = Math.round(Math.atan2(u.x - o.x, -(u.y - o.y)) * 180 / Math.PI / 90) * 90;   // how far the bare face leans, clockwise
  faces[f].rot = -ang; faces[f].el.style.transform = `${P(f)} rotateZ(${-ang}deg)`;
}
function turn(dy, dp) { if (fullFace >= 0) return; Qt = rollQ(Qt, dy, dp); present(Qt); }
function settle() {}
function goTo(i) {                                                     // shortest roll to face i (at most two), then straighten at once
  const moves = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  if (frontOf(Qt) !== i) {
    let done = false;
    for (const a of moves) if (!done && frontOf(rollQ(Qt, ...a)) === i) { Qt = rollQ(Qt, ...a); done = true; }
    for (const a of moves) for (const b of moves) if (!done && frontOf(rollQ(rollQ(Qt, ...a), ...b)) === i) { Qt = rollQ(rollQ(Qt, ...a), ...b); done = true; }
  }
  present(Qt);
}
function select(i) { selFace = i; faces.forEach((f, j) => f.el.classList.toggle('sel', j === i)); faces[i].term.focus(); }
function toggleFull() {
  if (fullFace >= 0) {                                                // back onto the cube
    const f = faces[fullFace]; f.el.appendChild(f.host); f.term.options.fontSize = 10; full.classList.remove('on');
    document.getElementById('scene').style.visibility = ''; fullFace = -1; paint(); renderAttn(); refit(f); f.term.focus(); return;
  }
  // 2026-10-28 Chris: long press on a new face (Claude's trust prompt) opened some OTHER session: this used the last SELECTED face,
  // which stays put while you roll. Full screen is always the face in front of you, and typing goes there.
  const i = frontFace(), f = faces[i]; select(i); fullFace = i;
  full.appendChild(f.host); f.term.options.fontSize = 14; full.classList.add('on'); paint(); document.getElementById('scene').style.visibility = 'hidden';
  label(f); renderAttn(); refit(f); f.term.focus();
}
function pressDown() { const i = frontFace(); if (fullFace >= 0) return; if (selFace === i) toggleFull(); else select(i); }
function pullUp() { if (fullFace >= 0) toggleFull(); }
function sbButtons(mask) {
  const pressed = mask & ~sbMask, released = sbMask & ~mask; sbMask = mask;
  const B = prefs.buttons, bit = n => (n ? 1 << (n - 1) : 0);
  for (let g = 1; g <= 4; g++) { const b = bit(B['color' + g]); if (pressed & b) colorDown(g); if (released & b) colorUp(g); }
  if (pressed & bit(B.jump)) jumpNext();
  if (pressed & bit(B.back)) goBack();
  if (!pressed) return;
  if (pressed & 1) { const i = frontFace(); select(i); }
  if (pressed & 2) toggleFull();
  if (pressed & 4) { if (fullFace >= 0) toggleFull(); Qt = [1, 0, 0, 0]; faces.forEach((f, i) => { f.rot = 0; f.el.style.transform = P(i); }); select(0); }
}
// the PowerMate (Chris 22:28): turning rolls the cube side to side, or top to bottom; a tap swaps which; a double tap picks the face.
// A long press (over 0.6 s, no turning) = full screen on/off. About 8 clicks = one face.
let knobAcc = 0, kHeld = false, kPress = 0, kTurned = false, kMode = 'side', kTapTimer = null;
function knob(t, b) {
  const now = performance.now();
  if (b && !kHeld) { kHeld = true; kPress = now; kTurned = false; }
  if (t) { kTurned = true; knobAcc += t;
    while (Math.abs(knobAcc) >= 8) { const d = knobAcc > 0 ? 1 : -1; kMode === 'side' ? turn(d, 0) : turn(0, d); knobAcc -= d * 8; } }
  if (!b && kHeld) {
    kHeld = false; if (kTurned) return;
    if (now - kPress > 600) { toggleFull(); return; }
    if (kTapTimer) { clearTimeout(kTapTimer); kTapTimer = null; select(frontFace()); }
    else kTapTimer = setTimeout(() => { kTapTimer = null; kMode = kMode === 'side' ? 'updown' : 'side'; showMode(); }, 300);
  }
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => el.style.display = 'none', 1500); }
function showMode() { toast(`knob now rolls ${kMode === 'side' ? 'side to side' : 'top to bottom'}`); }
addEventListener('keydown', e => {
  if (!(e.ctrlKey && e.altKey)) return;
  const k = e.key; let hit = true;
  if (k === 'ArrowLeft') turn(1, 0); else if (k === 'ArrowRight') turn(-1, 0); else if (k === 'ArrowUp') turn(0, -1); else if (k === 'ArrowDown') turn(0, 1);
  else if (k === 'Enter') toggleFull(); else if (/^[1-6]$/.test(e.code.replace('Digit', ''))) { const i = +e.code.replace('Digit', '') - 1; goTo(i); select(i); }
  else if (['Digit7', 'Digit8', 'Digit9', 'Digit0'].includes(e.code)) colorTap(['Digit7', 'Digit8', 'Digit9', 'Digit0'].indexOf(e.code) + 1);
  else if (e.code === 'KeyJ') jumpNext(); else if (e.code === 'KeyB') goBack();
  else hit = false;
  if (hit) { e.preventDefault(); e.stopPropagation(); }
}, true);

// spin (rz) steps left/right and tilt (rx) steps up/down, like Demo 02's feel; past PUSH it steps, it re-arms below RELEASE,
// and if you keep holding it steps again every REPEAT_MS. Signs are guesses: flip them on Chris's word.
function stepper(axis, v, now, fn) {
  if (Math.abs(v) < RELEASE) { armed[axis] = true; return; }
  if (Math.abs(v) > PUSH && (armed[axis] || now - heldSince[axis] > REPEAT_MS)) { fn(Math.sign(v)); armed[axis] = false; heldSince[axis] = now; }
}
let last = performance.now();
function frame(now) {
  const k = Math.min(3, (now - last) / 16.667); last = now;
  if (now - sbAt > 250) { sbT = [0, 0, 0]; sbR = [0, 0, 0]; }
  // 22:28 Chris: side to side gets stuck. Only the STRONGER of spin/tilt may step (a twist always leaks a little tilt, which used to
  // park the cube on the top/bottom face, where side steps were locked out).
  const z = sbT[2];
  if (z < -PRESS && zArmed) { zArmed = false; pressDown(); } else if (z > PRESS && zArmed) { zArmed = false; pullUp(); }
  else if (Math.abs(z) < RELEASE) zArmed = true;
  const spinV = Math.abs(z) > 120 ? 0 : -sbR[2], tiltV = Math.abs(z) > 120 ? 0 : sbR[0];   // pushing leaks twist: no turning mid-push
  if (Math.abs(spinV) >= Math.abs(tiltV)) { stepper('y', spinV, now, s => turn(s, 0)); armed.p = true; }
  else { stepper('p', tiltV, now, s => turn(0, s)); armed.y = true; }
  const leanY = Math.max(-1, Math.min(1, spinV / 350)) * 10, leanP = Math.max(-1, Math.min(1, tiltV / 350)) * 8;   // lean the way it will step
  const ease = 1 - Math.pow(0.9, k);                                   // slow, calm settle (about half a second)
  settle(now);
  Q = qSlerp(Q, Qt, ease);
  const shown = qMul(qMul(qAxis(0, 1, 0, leanY), qAxis(1, 0, 0, -leanP)), Q);
  cube.style.transform = `translateZ(${-S / 2}px) ` + qMatrix(shown).toString();
  const fr = frontFace(); faces.forEach((f, j) => f.el.classList.toggle('front', j === fr));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setTimeout(() => faces.forEach(refit), 300);
// ---------- Priority 1: colours and groups (Chris + Riven's spec, 2026-10-28). Colours belong to the FACE (= its shell and session),
// saved per computer in ~/.config/3d-terminal/config.json → "prefs". The default palette is the Okabe-Ito set (orange, sky blue, yellow,
// pink-purple): it stays tellable apart for colour-blind eyes, by brightness as well as hue. Every slot is changeable in the ⚙ panel.
const DEF = { colors: {}, palette: ['#e69f00', '#56b4e9', '#f0e442', '#cc79a7'],
  buttons: { color1: 4, color2: 5, color3: 7, color4: 8, jump: 9, back: 10 },
  glow: 1, lowfx: false, cluster: false, attnFinished: true, quiet: false, ageMin: 15 };
let prefs = JSON.parse(JSON.stringify(DEF));
function loadPrefs(p) { prefs = Object.assign(JSON.parse(JSON.stringify(DEF)), p, { buttons: Object.assign({}, DEF.buttons, p.buttons || {}) }); applyPrefs(); }
function savePrefs() { post('/config?prefs=1', JSON.stringify(prefs)); }
function applyPrefs() { document.body.classList.toggle('lowfx', !!prefs.lowfx); document.documentElement.style.setProperty('--glow', prefs.glow);
  paint(); layout(); renderPrefs(); renderAttn(); }
const cur = () => (fullFace >= 0 ? fullFace : frontFace());              // the face you are looking at (the same rule full screen uses)
function paint() {
  faces.forEach(f => { const g = prefs.colors[f.i]; f.el.classList.toggle('colored', !!g); if (g) f.el.style.setProperty('--gc', prefs.palette[g - 1]); });
  const g = fullFace >= 0 && prefs.colors[fullFace]; full.classList.toggle('colored', !!g); if (g) full.style.setProperty('--gc', prefs.palette[g - 1]);
}
function layout() {                                                      // group by colour: same colours sit next to each other
  const order = prefs.cluster ? [0, 1, 2, 3, 4, 5].sort((a, b) => ((prefs.colors[a] || 9) - (prefs.colors[b] || 9)) || a - b) : [0, 1, 2, 3, 4, 5];
  const ns = []; order.forEach((fi, k) => { ns[fi] = k; });               // places 0-1-2-3 run round the sides, so a group lands side by side
  if (ns.join() === slot.join()) return;
  const keep = cur(); slot = ns; faces.forEach(f => { f.rot = 0; f.el.style.transform = P(f.i); }); goTo(keep); select(keep);
}
function assignColor(g) {
  const i = cur(); if (prefs.colors[i] === g) delete prefs.colors[i]; else prefs.colors[i] = g;
  savePrefs(); paint(); layout(); renderAttn(); toast(prefs.colors[i] ? `face ${i + 1} → colour ${g}` : `face ${i + 1}: colour cleared`);
}
function cycleColor(g) {                                                 // next face with colour g after the one you're on
  const list = faces.map(f => f.i).filter(i => prefs.colors[i] === g); if (!list.length) { toast(`no face has colour ${g} yet`); return; }
  const i = list.find(x => x > cur()) ?? list[0]; openFace(i, fullFace >= 0);
}
function isolate(g) { faces.forEach(f => f.el.classList.toggle('dim', !!g && prefs.colors[f.i] !== g)); }
const taps = {};
function colorTap(g) {                                                   // one tap = colour this face · two quick taps = next face of that colour
  const t = taps[g] || (taps[g] = { n: 0 }); t.n++; clearTimeout(t.timer);
  t.timer = setTimeout(() => { const n = t.n; t.n = 0; n >= 2 ? cycleColor(g) : assignColor(g); }, 320);
}
function colorDown(g) { const t = taps[g] || (taps[g] = { n: 0 }); t.held = false; t.hold = setTimeout(() => { t.held = true; isolate(g); }, 500); }
function colorUp(g) { const t = taps[g]; if (!t) return; clearTimeout(t.hold); if (t.held) { t.held = false; isolate(0); } else colorTap(g); }

// ---------- Priority 2: Attention Routing. The server tells us (from Claude Code's own hooks) which faces wait on a person. A waiting
// face pulses in its own colour; a small list top-right names the others while you work. Nothing here ever types, answers, approves or
// takes your keyboard away: a notice only moves you when YOU click it or press jump. Looking at a face never clears it; × dismisses.
const att = faces.map(() => ({ s: 'working', r: '', since: 0, dismissed: false }));
const waiting = i => att[i].s === 'needs' && !att[i].dismissed && (prefs.attnFinished || !att[i].r.startsWith('finished'));
const attnq = document.getElementById('attnq');
function renderAttn() {
  faces.forEach(f => f.el.classList.toggle('attn', waiting(f.i)));
  const here = fullFace >= 0 ? fullFace : selFace;
  const list = faces.map(f => f.i).filter(i => waiting(i) && i !== here).sort((a, b) => att[a].since - att[b].since);
  attnq.replaceChildren(...(prefs.quiet ? [] : list.map(i => {
    const d = document.createElement('div'); d.className = 'aq'; d.dataset.f = i;
    d.textContent = `Face ${i + 1} · ${faces[i].title || 'shell'} · ${att[i].r}`;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = 'dismiss (it comes back if it asks again)';
    x.onclick = e => { e.stopPropagation(); att[i].dismissed = true; renderAttn(); };
    d.appendChild(x); d.onclick = () => jumpTo(i); return d;
  })));
  tint();
}
function mix(hex, t) { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (255 - v) * t));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join(''); }
function tint() {                                                        // the longer a face waits, the closer its pulse gets to white
  faces.forEach(f => { if (!waiting(f.i)) return; const g = prefs.colors[f.i], base = g ? prefs.palette[g - 1] : '#c9b8ff';
    const t = prefs.ageMin > 0 ? Math.min(1, (Date.now() - att[f.i].since) / (prefs.ageMin * 60000)) : 0, c = mix(base, t * 0.85);
    f.el.style.setProperty('--pc', c); const q = attnq.querySelector(`[data-f="${f.i}"]`); if (q) q.style.setProperty('--pc', c); });
}
setInterval(tint, 2000);
const backStack = [];
function openFace(i, wantFull) { if (fullFace >= 0 && fullFace !== i) toggleFull(); goTo(i); select(i); if (wantFull && fullFace < 0) toggleFull(); renderAttn(); }
function jumpTo(i) {                                                     // go to a waiting face, remembering exactly where you were
  const here = fullFace >= 0 ? fullFace : (selFace >= 0 ? selFace : frontFace()); if (here === i) return;
  backStack.push({ i: here, full: fullFace >= 0 }); if (backStack.length > 12) backStack.shift(); openFace(i, fullFace >= 0);
}
function jumpNext() {                                                    // oldest waiting first; nothing waiting = go back
  const here = fullFace >= 0 ? fullFace : selFace;
  const w = faces.map(f => f.i).filter(i => waiting(i) && i !== here).sort((a, b) => att[a].since - att[b].since);
  if (w.length) jumpTo(w[0]); else goBack();
}
function goBack() { const c = backStack.pop(); if (!c) { toast('nothing to go back to'); return; } openFace(c.i, c.full); }

// ---------- the ⚙ panel's settings for both
function renderPrefs() {
  const el = document.getElementById('prefs'), B = prefs.buttons, keys = ['7', '8', '9', '0'];
  const learn = t => `<a href="#" data-learn="${t}">change</a>`;
  el.innerHTML = `<b>COLOURS</b> (tap = colour this face · double tap = next face of it · hold = show only it)<br>` +
    [1, 2, 3, 4].map(g => `<input type="color" data-pal="${g}" value="${prefs.palette[g - 1]}"> ${g}: ball button <b>${B['color' + g]}</b> ${learn('color' + g)} · Ctrl+Option+${keys[g - 1]}`).join('<br>') +
    `<br>colour this face: ${[1, 2, 3, 4].map(g => `<button data-assign="${g}">${g}</button>`).join('')}` +
    `<br>glow <input type="range" id="p-glow" min="0" max="2" step="0.1" value="${prefs.glow}"> <label><input type="checkbox" id="p-lowfx" ${prefs.lowfx ? 'checked' : ''}> low effects</label>` +
    `<br><label><input type="checkbox" id="p-cluster" ${prefs.cluster ? 'checked' : ''}> group faces by colour</label> (moves faces, never sessions)` +
    `<br><b>ATTENTION</b> (a session waiting on you pulses in its colour)` +
    `<br><label><input type="checkbox" id="p-fin" ${prefs.attnFinished ? 'checked' : ''}> also when a session finishes its turn</label>` +
    `<br><label><input type="checkbox" id="p-quiet" ${prefs.quiet ? 'checked' : ''}> quiet: no list top-right (faces still pulse)</label>` +
    `<br>fade the pulse toward white over <input type="number" id="p-age" min="0" max="600" value="${prefs.ageMin}"> min (0 = never)` +
    `<br>jump to the oldest waiting: ball button <b>${B.jump}</b> ${learn('jump')} · Ctrl+Option+J` +
    `<br>back to where you were: ball button <b>${B.back}</b> ${learn('back')} · Ctrl+Option+B`;
  el.querySelectorAll('[data-pal]').forEach(i => { i.oninput = () => { prefs.palette[+i.dataset.pal - 1] = i.value; paint(); tint(); }; i.onchange = savePrefs; });
  el.querySelectorAll('[data-assign]').forEach(b => { b.onclick = () => assignColor(+b.dataset.assign); });
  el.querySelectorAll('[data-learn]').forEach(a => { a.onclick = e => { e.preventDefault(); post(`/config?learn=${a.dataset.learn}`); toast('press the button you want on your 3D mouse…'); }; });
  const on = (id, fn) => { document.getElementById(id).onchange = e => { fn(e.target); savePrefs(); applyPrefs(); }; };
  document.getElementById('p-glow').oninput = e => { prefs.glow = +e.target.value; document.documentElement.style.setProperty('--glow', prefs.glow); };
  document.getElementById('p-glow').onchange = savePrefs;
  on('p-lowfx', t => { prefs.lowfx = t.checked; }); on('p-cluster', t => { prefs.cluster = t.checked; });
  on('p-fin', t => { prefs.attnFinished = t.checked; }); on('p-quiet', t => { prefs.quiet = t.checked; });
  on('p-age', t => { prefs.ageMin = Math.max(0, +t.value || 0); });
}
const HELP = `SPACEBALL
twist = roll side to side · tilt = roll over the top
push down = select the face · push again = full screen
pull up = back to the cube · button 3 = home
hand-back button (6, or yours) = ball to your Mac / take it back

POWERMATE KNOB
turn = roll · tap = side-to-side ⇄ top-to-bottom
double tap = select · long press = full screen on/off

KEYBOARD (Ctrl+Option)
arrows = roll · Return = full screen · 1-6 = jump to a face
7 8 9 0 = colours 1-4 · J = jump to a waiting face · B = back
click a face to select it

COLOURS + ATTENTION: settings below`;
document.getElementById('helptext').textContent = HELP;
document.getElementById('learn').onclick = e => { e.preventDefault(); post('/config?learn=1'); toast('press the button you want on your 3D mouse…'); };
document.getElementById('gear').onclick = () => help.classList.toggle('on');
faces.forEach(label);                                                  // after fullFace exists (label reads it)
applyPrefs();                                                          // defaults until the server sends the saved prefs
// 22:58 Chris: the top of Claude's little mascot was clipped on the cube. The terminals kept an old row count after the title bar grew
// (and another page on the same server can resize the shells), so each terminal now refits whenever its box changes size, and all of
// them refit when this window comes back to the front.
// 23:03 the clipped mascot was Claude Code's own layout: under ~70 columns it drops the top of its header. Measured: 66 cols = gone,
// 73+ cols = all there. So the cube's faces use 10 px text (73+ columns even in a small window).
const ro = new ResizeObserver(es => es.forEach(e => { const f = faces.find(x => x.host === e.target); if (f) refit(f); }));
faces.forEach(f => ro.observe(f.host));
addEventListener('focus', () => faces.forEach(refit));
document.addEventListener('visibilitychange', () => { if (!document.hidden) faces.forEach(refit); });
if (!TerminalCls || !FitCls) help.textContent = 'xterm.js did not load (vendor files)';
</script></body></html>
